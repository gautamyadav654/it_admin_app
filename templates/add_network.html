{% extends "base.html" %}

{% block page_title %}Add Network Device{% endblock %}

{% block page_actions %}
<a href="{{ url_for('network') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a>
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-header bg-white border-0">
        <h5 class="mb-0">Add Network Device</h5>
    </div>
    <div class="card-body">
        <form method="POST" class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Device Name <span class="text-danger">*</span></label>
                <input type="text" name="device_name" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">IP Address</label>
                <input type="text" name="ip_address" class="form-control" placeholder="192.168.x.x">
            </div>
            <div class="col-md-6">
                <label class="form-label">MAC Address</label>
                <input type="text" name="mac_address" class="form-control" placeholder="00:1A:2B:3C:4D:5E">
            </div>
            <div class="col-md-6">
                <label class="form-label">Device Type</label>
                <select name="device_type" class="form-select">
                    <option value="">Select...</option>
                    {% for t in device_types %}
                    <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Location</label>
                <select name="location" class="form-select">
                    <option value="">Select...</option>
                    {% for loc in locations %}
                    <option value="{{ loc }}">{{ loc }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    {% for s in statuses %}
                    <option value="{{ s }}">{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Manufacturer</label>
                <select name="manufacturer" class="form-select">
                    <option value="">Select...</option>
                    {% for m in manufacturers %}
                    <option value="{{ m }}">{{ m }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Model</label>
                <input type="text" name="model" class="form-control">
            </div>
            <div class="col-12">
                <label class="form-label">Remarks</label>
                <textarea name="remarks" class="form-control" rows="3"></textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-info"><i class="bi bi-save"></i> Save Device</button>
                <a href="{{ url_for('network') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
