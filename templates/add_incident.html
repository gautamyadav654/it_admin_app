{% extends "base.html" %}

{% block page_title %}New Incident{% endblock %}

{% block page_actions %}
<a href="{{ url_for('incidents') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a>
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-header bg-white border-0">
        <h5 class="mb-0">Create New Incident</h5>
    </div>
    <div class="card-body">
        <form method="POST" class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Ticket Number <span class="text-danger">*</span></label>
                <input type="text" name="ticket_number" class="form-control" required placeholder="e.g., INC-2024-001">
            </div>
            <div class="col-md-6">
                <label class="form-label">Date <span class="text-danger">*</span></label>
                <input type="date" name="date" class="form-control" value="{{ datetime.now().strftime('%Y-%m-%d') }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">User</label>
                <select name="user" class="form-select">
                    <option value="">Select User</option>
                    {% for u in users %}
                    <option value="{{ u.name }}">{{ u.name }} ({{ u.employee_id }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Asset</label>
                <select name="asset" class="form-select">
                    <option value="">Select Asset</option>
                    {% for a in assets %}
                    <option value="{{ a.asset_id }}">{{ a.asset_id }} - {{ a.hostname }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Category</label>
                <select name="category" class="form-select">
                    <option value="">Select...</option>
                    {% for c in categories %}
                    <option value="{{ c }}">{{ c }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Subcategory</label>
                <input type="text" name="subcategory" class="form-control" placeholder="e.g., Installation, Repair">
            </div>
            <div class="col-md-4">
                <label class="form-label">Priority</label>
                <select name="priority" class="form-select">
                    {% for p in priorities %}
                    <option value="{{ p }}">{{ p }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-12">
                <label class="form-label">Issue <span class="text-danger">*</span></label>
                <input type="text" name="issue" class="form-control" required placeholder="Brief description of the issue">
            </div>
            <div class="col-12">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" placeholder="Detailed description..."></textarea>
            </div>
            <div class="col-12">
                <label class="form-label">Action Taken</label>
                <textarea name="action_taken" class="form-control" rows="2" placeholder="What steps were taken..."></textarea>
            </div>
            <div class="col-12">
                <label class="form-label">Resolution</label>
                <textarea name="resolution" class="form-control" rows="2" placeholder="How was it resolved..."></textarea>
            </div>
            <div class="col-md-4">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    {% for s in statuses %}
                    <option value="{{ s }}">{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Assigned To</label>
                <select name="assigned_to" class="form-select">
                    <option value="">Unassigned</option>
                    {% for a in assigned_to_options %}
                    <option value="{{ a }}">{{ a }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Resolution Date</label>
                <input type="date" name="resolution_date" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">SLA Target (hours)</label>
                <input type="number" name="sla_target" class="form-control" placeholder="e.g., 24">
            </div>
            <div class="col-12">
                <label class="form-label">Remarks</label>
                <textarea name="remarks" class="form-control" rows="2"></textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-warning"><i class="bi bi-save"></i> Create Incident</button>
                <a href="{{ url_for('incidents') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
