{% extends "base.html" %}

{% block page_title %}Add Maintenance Record{% endblock %}

{% block page_actions %}
<a href="{{ url_for('maintenance') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left"></i> Back</a>
{% endblock %}

{% block content %}
<div class="card shadow-sm border-0">
    <div class="card-header bg-white border-0">
        <h5 class="mb-0">Add Maintenance Record</h5>
    </div>
    <div class="card-body">
        <form method="POST" class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Asset <span class="text-danger">*</span></label>
                <select name="asset_id" class="form-select" required>
                    <option value="">Select Asset</option>
                    {% for a in assets %}
                    <option value="{{ a.asset_id }}">{{ a.asset_id }} - {{ a.hostname }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label">Asset Name</label>
                <input type="text" name="asset_name" class="form-control">
            </div>
            <div class="col-md-4">
                <label class="form-label">Maintenance Type</label>
                <select name="type" class="form-select">
                    {% for t in maintenance_types %}
                    <option value="{{ t }}">{{ t }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Date <span class="text-danger">*</span></label>
                <input type="date" name="date" class="form-control" value="{{ datetime.now().strftime('%Y-%m-%d') }}" required>
            </div>
            <div class="col-md-4">
                <label class="form-label">Performed By</label>
                <input type="text" name="performed_by" class="form-control" placeholder="e.g., Tech Team, Vendor Name">
            </div>
            <div class="col-md-4">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    {% for s in statuses %}
                    <option value="{{ s }}">{{ s }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Cost</label>
                <input type="text" name="cost" class="form-control" placeholder="e.g., ₹5,000 or $100">
            </div>
            <div class="col-12">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3" placeholder="Describe the maintenance performed..."></textarea>
            </div>
            <div class="col-12">
                <label class="form-label">Remarks</label>
                <textarea name="remarks" class="form-control" rows="2"></textarea>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-secondary"><i class="bi bi-save"></i> Save Record</button>
                <a href="{{ url_for('maintenance') }}" class="btn btn-outline-secondary ms-2">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
